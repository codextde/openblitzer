# Local self-hosting: OPENBLITZER_ADMIN_TOKEN=change-me docker compose up -d --build
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - OPENBLITZER_ADMIN_TOKEN=${OPENBLITZER_ADMIN_TOKEN:-}
      - OPENBLITZER_SALT=${OPENBLITZER_SALT:-}
      - OPENBLITZER_COUNTRIES=${OPENBLITZER_COUNTRIES:-}
      - OVERPASS_URL=${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
    ports:
      - "${OPENBLITZER_PORT:-8080}:8080"
    volumes:
      - openblitzer-data:/data
    restart: unless-stopped

volumes:
  openblitzer-data:
